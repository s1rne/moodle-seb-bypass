[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moodle-seb-bypass"
version = "1.0.0"
description = "Take Moodle quizzes locked with Safe Exam Browser from your regular browser — pure Python, macOS/Windows/Linux."
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Alexander" }]
requires-python = ">=3.9"
dependencies = [
    "mitmproxy>=9.0; platform_system != 'Windows' or python_version < '3.13'",
]
keywords = ["moodle", "seb", "safe-exam-browser", "bypass", "quiz", "mitmproxy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education :: Testing",
]

[project.urls]
Homepage = "https://github.com/s1rne/moodle-seb-bypass"
Documentation = "https://github.com/s1rne/moodle-seb-bypass#readme"

[project.scripts]
seb-bypass = "seb_bypass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["seb_bypass"]
